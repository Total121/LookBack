# Docker/Node web service blueprint. Fill ADMIN_* and TURNSTILE_* in the dashboard.
# Do not commit real secrets.

services:
  - type: web
    name: lookback
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/public/config
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUD
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: auto
      - key: REQUIRE_TURNSTILE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
